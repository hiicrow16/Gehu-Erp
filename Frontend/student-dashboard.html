<!DOCTYPE html>
<html>
<head>
  <title>Student Dashboard - GEHU</title>

  <style>
    body {
      margin: 0; display: flex; font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top left, #0f172a, #020617); color: white;
    }
    .sidebar {
      width: 240px; height: 100vh; background: linear-gradient(180deg, #0f172a, #020617);
      padding: 20px; position: fixed; display: flex; flex-direction: column;
      box-shadow: 0 0 25px rgba(0,255,255,0.1);
    }
    .sidebar h2 { margin-bottom: 30px; color: #22d3ee; }
    .sidebar a {
      color: white; padding: 12px; margin: 6px 0; border-radius: 10px; cursor: pointer;
      transition: 0.3s; background: rgba(255,255,255,0.05);
    }
    .sidebar a:hover { background: linear-gradient(90deg, #06b6d4, #3b82f6); transform: translateX(5px); }
    .logout { margin-top: auto; background: red; padding: 10px; text-align: center; border-radius: 6px; cursor: pointer; }
    .main-content { margin-left: 240px; padding: 40px; width: 100%; }
    .section { display: none; }
    .section.active { display: block; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
    .dashboard-card { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 16px; text-align: center; backdrop-filter: blur(10px); transition: 0.3s; }
    .dashboard-card:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(59,130,246,0.4); }
    .courses-container { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
    .course-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; width: 240px; transition: 0.3s; }
    .course-card:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(59,130,246,0.4); }
    table { margin-top: 20px; width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
    select { padding: 8px; border-radius: 8px; border: none; background: rgba(255,255,255,0.1); color: white; margin-bottom: 10px; }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>GEHU Student</h2>
  <a onclick="showSection('dashboard')">Dashboard</a>
  <a onclick="showSection('courses')">My Courses</a>
  <a onclick="showSection('attendance')">Attendance</a>
  <div class="logout" onclick="logout()">Logout</div>
</div>

<div class="main-content">

<section id="dashboard" class="section active">
  <h1 id="welcomeMsg">Welcome</h1>
  <div class="card-grid">
    <div class="dashboard-card">Student ID<br><strong id="dashStudentId">--</strong></div>
    <div class="dashboard-card">Course<br><strong id="dashCourse">--</strong></div>
    <div class="dashboard-card">Semester<br><strong id="dashSemester">--</strong></div>
    <div class="dashboard-card">Attendance<br><strong id="attPercent">--%</strong></div>
  </div>
</section>

<section id="courses" class="section">
  <h2>My Courses</h2>
  <div id="coursesContainer" class="courses-container"></div>
</section>

<section id="attendance" class="section">
  <h2>Attendance</h2>
  <select id="filterStatus" onchange="applyFilter()">
    <option>All</option>
    <option>Present</option>
    <option>Absent</option>
  </select>
  <h3 id="percentage"></h3>
  <table id="attendanceTable">
    <thead><tr><th>Date</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>
</section>

</div>

<script src="config.js"></script>
<script>
const API = window.API_BASE;
const token = localStorage.getItem("token");

/* AUTH GUARD */
if (localStorage.getItem("role") !== "student" || !token) {
  window.location.href = "login.html";
}

function authHeaders() {
  return { Authorization: `Bearer ${localStorage.getItem("token")}` };
}

let currentProfileId = null;

/* NAVIGATION */
function showSection(sectionId) {
  document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active"));
  document.getElementById(sectionId).classList.add("active");
}

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

/* LOAD OWN PROFILE + COURSE + SUBJECTS (database-driven, no hardcoded subject map) */
async function loadProfile() {
  const res = await fetch(`${API}/students/me`, { headers: authHeaders() });
  const data = await res.json();
  if (!data.success) return;

  const student = data.student;
  currentProfileId = student._id;

  document.getElementById("welcomeMsg").innerText = `Welcome, ${student.name}`;
  document.getElementById("dashStudentId").innerText = student.studentId;
  document.getElementById("dashCourse").innerText = student.course ? student.course.name : "Not assigned";
  document.getElementById("dashSemester").innerText = student.semester || "-";

  const container = document.getElementById("coursesContainer");
  container.innerHTML = "";

  if (!student.course) {
    container.innerHTML = "<p>No course assigned yet. Contact admin.</p>";
  } else {
    const subRes = await fetch(
      `${API}/subjects?course=${student.course._id}${student.semester ? `&semester=${student.semester}` : ""}`,
      { headers: authHeaders() }
    );
    const subData = await subRes.json();
    const subjects = subData.success ? subData.subjects : [];

    const card = document.createElement("div");
    card.className = "course-card";
    const list = subjects.length
      ? subjects.map(s => `<li>${s.name}</li>`).join("")
      : "<li>No subjects added for this semester yet</li>";
    card.innerHTML = `<h3>${student.course.name}</h3><ul>${list}</ul>`;
    container.appendChild(card);
  }

  await loadAttendance();
}

/* LOAD ATTENDANCE - real records + computed percentage, no fake fallback data */
async function loadAttendance() {
  if (!currentProfileId) return;

  const res = await fetch(`${API}/attendance/student/${currentProfileId}`, { headers: authHeaders() });
  const data = await res.json();
  if (!data.success) return;

  renderAttendance(data.records, data.summary.percentage);
}

function renderAttendance(records, percent) {
  const tableBody = document.querySelector("#attendanceTable tbody");
  tableBody.innerHTML = "";

  if (!records.length) {
    tableBody.innerHTML = `<tr><td colspan="2">No attendance recorded yet</td></tr>`;
  }

  records.forEach(r => {
    const dateStr = new Date(r.date).toLocaleDateString();
    tableBody.innerHTML += `<tr><td>${dateStr}</td><td>${r.status}</td></tr>`;
  });

  const pctEl = document.getElementById("attPercent");
  pctEl.innerText = percent + "%";
  pctEl.style.color = percent < 75 ? "#ff4d6d" : "#00ff88";

  document.getElementById("percentage").innerText = `Attendance: ${percent}%`;
}

async function applyFilter() {
  if (!currentProfileId) return;
  const filter = document.getElementById("filterStatus").value;

  const res = await fetch(`${API}/attendance/student/${currentProfileId}`, { headers: authHeaders() });
  const data = await res.json();
  if (!data.success) return;

  const filtered = filter === "All" ? data.records : data.records.filter(r => r.status === filter);
  const tableBody = document.querySelector("#attendanceTable tbody");
  tableBody.innerHTML = "";
  filtered.forEach(r => {
    const dateStr = new Date(r.date).toLocaleDateString();
    tableBody.innerHTML += `<tr><td>${dateStr}</td><td>${r.status}</td></tr>`;
  });
}

/* INIT */
loadProfile();
</script>

</body>
</html>
