# If you deploy this whole repo to Netlify, point the site at the
# Frontend/ folder like this (Site settings -> Build & deploy also works,
# but this file makes it automatic).

[build]
  base = "Frontend"
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# service worker must always be revalidated so updates reach users
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
